name: Daily Watch

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions uses UTC. The 01:20 run samples across the 09:25-09:30
    # auction window, and the later runs act as catch-up refreshes if GitHub
    # starts the scheduled job late.
    - cron: "20,28,36,45,55 1 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-watch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update daily watch
        env:
          WATCH_UNTIL_HHMMSS: ${{ github.event_name == 'schedule' && '093100' || '' }}
          WATCH_SAMPLE_SECONDS: ${{ github.event_name == 'schedule' && '120' || '0' }}
        run: python scripts/update_daily_watch.py

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update daily watch"
          file_pattern: "data/daily_watch.json"
